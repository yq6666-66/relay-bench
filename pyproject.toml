[project]
name = "relay-bench"
version = "0.4.0"
description = "Controlled mock relay for benchmarking open-source LLM relay detectors"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["starlette>=0.37", "uvicorn>=0.30", "httpx>=0.27", "pyyaml>=6"]

[project.scripts]
relay-bench = "bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench", "proxy"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6", "mypy>=1.10", "types-pyyaml"]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["experimental: arms not yet benchmarked (replay)"]
